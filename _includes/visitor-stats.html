{%- comment -%}
  홈 상단 방문자 수. _config.yml 의 visitor_counter 설정을 쓴다.
  Abacus 카운터에 day-YYYY-MM-DD / month-YYYY-MM / total 키를 두고,
  한 브라우저는 하루 한 번만 세 개를 같이 올린다. 배포 사이트에서만 올리고 로컬에서는 읽기만 한다.
{%- endcomment -%}
{% assign vc = site.visitor_counter %}
{% if vc.namespace %}
  <div class="visitor-stats" id="visitor-stats">
    <div class="visitor-stats-title"><i class="far fa-eye"></i> 방문자</div>
    <div class="visitor-stats-row">
      <div class="visitor-stat">
        <span class="label">오늘</span>
        <span class="value" data-range="today">-</span>
      </div>
      <div class="visitor-stat">
        <span class="label">이번 달</span>
        <span class="value" data-range="month">-</span>
      </div>
      <div class="visitor-stat">
        <span class="label">전체</span>
        <span class="value" data-range="total">-</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const box = document.getElementById('visitor-stats');
      if (!box) return;

      const api = 'https://abacus.jasoncameron.dev';
      const ns = '{{ vc.namespace }}';
      const count = {{ jekyll.environment | jsonify }} === 'production';
      const baseTotal = {{ vc.base_total | default: 0 }};
      const baseMonths = {{ vc.base_months | jsonify }} || {};

      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date()); /* YYYY-MM-DD */
      const month = today.slice(0, 7);
      const keys = {
        today: { key: `day-${today}`, base: 0 },
        month: { key: `month-${month}`, base: baseMonths[month] || 0 },
        total: { key: 'total', base: baseTotal }
      };

      /* 오늘 이미 센 브라우저면 읽기만 한다. 저장소를 못 쓰는 환경에서는 세지 않는다. */
      const seenKey = 'visitor-counted';
      let hit = false;
      try {
        hit = count && localStorage.getItem(seenKey) !== today;
        if (hit) localStorage.setItem(seenKey, today);
      } catch (e) {
        hit = false;
      }

      const nf = new Intl.NumberFormat('ko-KR');
      Object.entries(keys).forEach(([range, { key, base }]) => {
        const el = box.querySelector(`[data-range="${range}"]`);
        fetch(`${api}/${hit ? 'hit' : 'get'}/${ns}/${key}?_=${Date.now()}`, { cache: 'no-store' })
          .then((res) => (res.ok ? res.json() : res.status === 404 ? { value: 0 } : Promise.reject(res.status)))
          .then((data) => {
            el.textContent = nf.format(Number(data.value || 0) + base);
          })
          .catch(() => {
            el.textContent = '-';
          });
      });
    });
  </script>
{% endif %}
