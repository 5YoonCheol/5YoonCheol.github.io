{%- comment -%}
  홈 상단 방문자 수 (GoatCounter). _config.yml 의 analytics.goatcounter.id 가 있을 때만 보인다.
{%- endcomment -%}
{% if site.analytics.goatcounter.id %}
  <div class="visitor-stats" id="visitor-stats">
    <div class="visitor-stats-title"><i class="far fa-eye"></i> 방문자</div>
    <div class="visitor-stats-row">
      <div class="visitor-stat">
        <span class="label">오늘</span>
        <span class="value" data-range="today">-</span>
      </div>
      <div class="visitor-stat">
        <span class="label">이번 달</span>
        <span class="value" data-range="month">-</span>
      </div>
      <div class="visitor-stat">
        <span class="label">전체</span>
        <span class="value" data-range="total">-</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const box = document.getElementById('visitor-stats');
      if (!box) return;

      const base = 'https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/TOTAL.json';
      // GoatCounter는 방문을 사이트 설정의 시간대(기본 UTC) 날짜로 저장한다.
      // 날짜 경계를 그쪽과 맞춰야 오늘/이번 달 숫자가 맞는다.
      const tz = '{{ site.analytics.goatcounter.timezone | default: "UTC" }}';
      const fmt = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(d); // YYYY-MM-DD
      const today = fmt(new Date());
      // end는 그날 0시로 해석돼서 오늘까지 넣으려면 내일 날짜를 줘야 한다.
      // end를 아예 빼면 TOTAL이 0으로 나오는 경우가 있어 항상 start와 end를 함께 보낸다.
      const tomorrow = fmt(new Date(Date.parse(today + 'T12:00:00Z') + 86400000));
      // 집계 시작일. 이보다 이른 기록(개설 첫날 자동 방문 등)은 세지 않는다.
      const since = '{{ site.analytics.goatcounter.since | default: "2024-01-01" }}';
      const later = (a, b) => (a > b ? a : b);
      const monthStart = later(`${today.slice(0, 8)}01`, since);
      const ranges = {
        today: `?start=${later(today, since)}&end=${tomorrow}`,
        month: `?start=${monthStart}&end=${tomorrow}`,
        total: `?start=${since}&end=${tomorrow}`
      };

      Object.entries(ranges).forEach(([key, query]) => {
        const el = box.querySelector(`[data-range="${key}"]`);
        fetch(base + query)
          .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
          .then((data) => {
            const count = Number(String(data.count).replace(/\D/g, ''));
            el.textContent = new Intl.NumberFormat('ko-KR').format(count);
          })
          .catch(() => {
            // 해당 기간 방문 기록이 없으면 404가 온다.
            el.textContent = '0';
          });
      });
    });
  </script>
{% endif %}
